databaseChangeLog:
  - changeSet:
      id: 8
      author: Alexsandr
      changes:
        - createTable:
            schemaName: medical
            tableName: attachments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: mo_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_attachments_patient
            baseTableSchemaName: medical
            baseTableName: attachments
            baseColumnNames: patient_id
            referencedTableSchemaName: medical
            referencedTableName: patients
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_attachments_mo
            baseTableSchemaName: medical
            baseTableName: attachments
            baseColumnNames: mo_id
            referencedTableSchemaName: medical
            referencedTableName: medical_organizations
            referencedColumnNames: id

        - sql:
            dbms: postgresql
            sql: ALTER TABLE medical.attachments ADD CONSTRAINT ck_attachment_type CHECK (type IN ('AMBULATORY', 'DENTAL'))

        - createIndex:
            schemaName: medical
            tableName: attachments
            indexName: idx_attachments_patient_id
            columns:
              - column: { name: patient_id }

        - createIndex:
            schemaName: medical
            tableName: attachments
            indexName: idx_attachments_mo_id
            columns:
              - column: { name: mo_id }