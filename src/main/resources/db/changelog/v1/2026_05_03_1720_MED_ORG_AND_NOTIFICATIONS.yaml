              - column: { name: email, value: "dermatology@test.local" }

  - changeSet:
      id: 6
      author: Alexsandr
      changes:
        - addForeignKeyConstraint:
            constraintName: fk_orders_creator_org
            baseTableSchemaName: medical
            baseTableName: orders
            baseColumnNames: creator_org_id
            referencedTableSchemaName: medical
            referencedTableName: medical_organizations
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_orders_executor_org
            baseTableSchemaName: medical
            baseTableName: orders
            baseColumnNames: executor_org_id
            referencedTableSchemaName: medical
            referencedTableName: medical_organizations
            referencedColumnNames: id

        - createIndex:
            schemaName: medical
            tableName: orders
            indexName: idx_orders_creator_org
            columns:
              - column: { name: creator_org_id }

        - createIndex:
            schemaName: medical
            tableName: orders
            indexName: idx_orders_executor_org
            columns:
              - column: { name: executor_org_id }

  - changeSet:
      id: 7
      author: Alexsandr
      changes:
        - createTable:
            schemaName: medical
            tableName: notification_outbox
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipient_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: recipient_address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: message_text
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: VARCHAR(2000)
              - column:
                  name: last_attempt_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: attempt_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: related_entity_id
                  type: BIGINT
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - sql:
            dbms: postgresql
            sql: ALTER TABLE medical.notification_outbox ADD CONSTRAINT ck_outbox_recipient_type CHECK (recipient_type IN ('MO', 'PATIENT'))

        - createIndex:
            schemaName: medical
            tableName: notification_outbox
            indexName: idx_outbox_last_attempt
            columns:
              - column: { name: last_attempt_time }